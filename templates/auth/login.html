{% extends "base.html" %} {% block title %}Log In{% endblock title %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Secure Session</p>
    <h1>Log in to continue</h1>
    <p class="lead">Project workspaces require authentication and a verified TOTP device.</p>
  </div>
</section>

<section class="panel" style="max-width: 520px;">
  <form class="form-grid" action="{% url 'login' %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button button--primary">Log In</button>
    <a href="{% url 'signup' %}">Register a new account</a>
  </form>
</section>
{% endblock content %}
